name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to gh-pages
        run: |
          cd dist
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          touch .nojekyll
          git add -A
          git commit -m "Deploy $(date -u '+%Y-%m-%d %H:%M')"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Skaneby/Bokf-ring-.git" HEAD:gh-pages
